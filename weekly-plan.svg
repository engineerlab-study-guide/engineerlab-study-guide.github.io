<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280" role="img" aria-labelledby="title desc"><title id="title">주당 10시간 학습 시간 배분 예시</title><desc id="desc">강의 수강 5시간, 복습 2시간, 문제 풀이 3시간의 합계는 주당 10시간입니다. 실제 강좌의 분량이 아닌 계획 예시입니다.</desc><rect width="840" height="280" fill="#ffffff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="36" y="54" font-size="24" font-weight="700" fill="#172647">수강 시간 + 직접 공부하는 시간</text><text x="36" y="88" font-size="18" fill="#516078">주당 10시간을 확보했을 때의 배분 예시</text><rect x="36" y="122" width="384" height="64" fill="#1639a4"/><rect x="420" y="122" width="154" height="64" fill="#006b64"/><rect x="574" y="122" width="230" height="64" fill="#506587"/><text x="228" y="162" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">강의 5시간</text><text x="497" y="162" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">복습 2시간</text><text x="689" y="162" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">문제 풀이 3시간</text><text x="36" y="234" font-size="18" fill="#516078">이해 속도와 시험까지 남은 기간에 맞춰 조정하세요.</text></g></svg>
