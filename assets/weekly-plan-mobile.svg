<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title desc"><title id="title">주당 10시간 공부 예시</title><desc id="desc">강의 5시간, 복습 2시간, 문제 풀이 3시간의 합계는 10시간입니다.</desc><rect width="360" height="320" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="22" y="38" font-size="20" font-weight="700" fill="#172647">주당 10시간 공부 예시</text><text x="22" y="67" font-size="16" fill="#516078">수강과 자습 시간을 따로 확보하세요.</text><text x="22" y="112" font-size="18" font-weight="700" fill="#1639a4">강의 수강 · 5시간</text><rect x="22" y="123" width="316" height="22" rx="4" fill="#eef2f8"/><rect x="22" y="123" width="158" height="22" rx="4" fill="#1639a4"/><text x="22" y="178" font-size="18" font-weight="700" fill="#006b64">복습 · 2시간</text><rect x="22" y="189" width="316" height="22" rx="4" fill="#eef2f8"/><rect x="22" y="189" width="63.2" height="22" rx="4" fill="#006b64"/><text x="22" y="244" font-size="18" font-weight="700" fill="#506587">문제 풀이 · 3시간</text><rect x="22" y="255" width="316" height="22" rx="4" fill="#eef2f8"/><rect x="22" y="255" width="94.8" height="22" rx="4" fill="#506587"/><text x="22" y="304" font-size="15" fill="#516078">실제 강좌의 분량이 아닌 계획 예시입니다.</text></g></svg>
